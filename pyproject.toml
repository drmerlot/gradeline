[project]
name = "gradeline"
version = "0.0.1"
description = "Watershed data engine for building-level water risk"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj",
  "pyarrow",
  "requests",
  "pyyaml",
  "folium",
]

[project.scripts]
gradeline = "gradeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
