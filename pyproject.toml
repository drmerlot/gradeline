[project]
name = "gradeline"
version = "0.0.1"
description = "Watershed data engine for building-level water risk"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj",
  "pyarrow",
  "requests",
  "pyyaml",
  "folium",
  "rasterio>=1.4,<1.5",
  "matplotlib>=3.11.2",
  "contextily>=1.7.1",
  "py3dep>=0.19.0",
  "pygeohydro>=0.19.4",
  "overturemaps>=1.0.2",
  "whitebox-workflows>=2.0.6",
]

[project.scripts]
gradeline = "gradeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
