# One entry per watershed. The pipeline reads only this file to know what to build.
onion_creek:
  name: Onion Creek (Austin, TX)
  # Processing tile = full HUC-10 1209020504. Lower Onion Ck (US-183 gauge, buyout areas) is in 0409,
  # so 0409 must be included. True Onion-only drainage gets delineated from the DEM later.
  state: TX
  crs: EPSG:26914         # NAD83 / UTM 14N (meters)
  huc12:
    - "120902050401"  # Headwaters Onion Creek
    - "120902050402"  # South Onion Creek
    - "120902050403"  # Gatlin Creek-Onion Creek
    - "120902050404"  # Yorks Creek-Onion Creek
    - "120902050405"  # Mustang Branch-Onion Creek
    - "120902050406"  # Bear Creek
    - "120902050407"  # Slaughter Creek-Onion Creek
    - "120902050408"  # Williamson Creek-Onion Creek (Dove Springs)
    - "120902050409"  # Carson Creek-Colorado River (lower Onion Ck to its mouth + Carson Ck + Colorado mainstem)
  buffer_m: 500          # pad AOI so terrain routing isn't clipped at the divide
  # 1 m lidar pilot: Dove Springs + lower Onion Ck buyout areas (~65 km2).
  # Full 0408+0409 (~230 km2) was ~1.5 GB of tile reads; too big for a pilot.
  pilot_1m_bbox: [-97.76, 30.15, -97.66, 30.21]   # lon/lat W, S, E, N
  nlcd_years:
    impervious: [2001, 2011, 2021]
    cover: [2021]
  terrain:
    breach_max_dist_m: 100      # max breach length; road culverts are usually < 100 m
    stream_threshold_km2: 1.0   # "nearest drainage" for HAND / distance to stream
    hand_scales_km2: [10, 100]  # extra HAND networks for backwater from bigger creeks
  validation_gauges:      # USGS NWIS drainage areas; checks DEM flow routing
    "08158700": {name: Onion Ck nr Driftwood, lat: 30.08299, lon: -98.00779, da_mi2: 124}
    "08158800": {name: Onion Ck at Buda, lat: 30.08605, lon: -97.84806, da_mi2: 166}
    "08158827": {name: Onion Ck at Twin Creeks Rd, lat: 30.12632, lon: -97.82112, da_mi2: 181}
    "08158860": {name: Slaughter Ck at FM 2304, lat: 30.16216, lon: -97.83223, da_mi2: 23.1}
    "08158970": {name: Williamson Ck at Jimmy Clay Rd, lat: 30.18938, lon: -97.73250, da_mi2: 27.6}
    "08159000": {name: Onion Ck at US Hwy 183, lat: 30.17799, lon: -97.68861, da_mi2: 321}
    "08159100": {name: Onion Ck bl Del Valle, lat: 30.18966, lon: -97.62028, da_mi2: 339}
  min_footprint_m2: 40    # drop sheds / carports
